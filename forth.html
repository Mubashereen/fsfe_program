
<!DOCTYPE html>
<html>
<head>
    <title>CSS Example</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
            font-size: 48px;
        }

        p {
            color: rgb(26, 176, 26);
            font-size: 24px;
        }

        .box {
            background-color: lightyellow;
            border: 3px solid red;
            padding: 30px;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h1>Welcome to CSS</h1>

    <p>This is a simple paragraph styled using CSS.</p>

    <div class="box">
        This box uses a class selector.
    </div>

</body>
</html>
